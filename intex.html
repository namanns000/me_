<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
    canvas, .abs-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    canvas { top: 0; left: 0; transform: none; display: block; }

    #bg { z-index: 0; } #mid { z-index: 1; } #fx { z-index: 2; }
    #aura { z-index: 3; } #beams { z-index: 4; } #core-wrap { z-index: 6; }

    #core {
      width: 12px; height: 12px; background: #fff; border-radius: 50%;
      animation: core-pulse 4.5s ease-in-out infinite;
    }

    .orbit { position: absolute; top: 50%; left: 50%; border-radius: 50%; border: 1px solid rgba(130, 210, 255, 0.13); transform: translate(-50%, -50%); }
    .orbit::after { content: ''; position: absolute; background: rgba(190, 235, 255, 0.95); border-radius: 50%; box-shadow: 0 0 12px 4px rgba(130, 220, 255, 0.75); }

    #o1 { width: 160px; height: 160px; animation: spin 32s linear infinite; }
    #o1::after { top: -3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; }
    #o2 { width: 250px; height: 250px; animation: spin-rev 52s linear infinite; border-color: rgba(110, 170, 255, 0.1); }
    #o2::after { top: 50%; right: -3px; transform: translateY(-50%); width: 4px; height: 4px; }
    #o3 { width: 360px; height: 360px; animation: spin 78s linear infinite; border-color: rgba(90, 140, 230, 0.07); }
    #o3::after { bottom: -2px; left: 28%; width: 3.5px; height: 3.5px; }
    #o4 { width: 480px; height: 480px; animation: spin-rev 110s linear infinite; border-color: rgba(70, 110, 200, 0.05); }
    #o4::after { top: 18%; left: -2px; width: 3px; height: 3px; }
    #o5 { width: 600px; height: 600px; animation: spin 150s linear infinite; border-color: rgba(50, 90, 170, 0.035); }
    #o5::after { bottom: 25%; right: -1.5px; width: 2.5px; height: 2.5px; }

    #aura {
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(110,190,255,.14) 0%, rgba(80,130,230,.07) 22%, rgba(50,80,170,.03) 48%, transparent 70%);
      filter: blur(35px); animation: aura-breathe 9s ease-in-out infinite;
    }

    #beams { width: 900px; height: 900px; animation: spin 180s linear infinite; opacity: 0.35; }
    .beam { position: absolute; top: 50%; left: 50%; width: 1px; height: 45%; background: linear-gradient(to top, transparent, rgba(140, 210, 255, 0.4), transparent); transform-origin: bottom center; }

    #cursor {
      position: fixed; width: 18px; height: 18px; border: 1px solid rgba(170, 230, 255, 0.55);
      border-radius: 50%; pointer-events: none; z-index: 100; transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, border-color 0.25s, box-shadow 0.25s; mix-blend-mode: screen;
    }
    #cursor::after { content: ''; position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; background: rgba(210, 245, 255, 0.95); border-radius: 50%; transform: translate(-50%, -50%); }
    #cursor.trail-active { width: 28px; height: 28px; border-color: rgba(190, 240, 255, 0.85); box-shadow: 0 0 20px 6px rgba(140, 220, 255, 0.4); }

    @keyframes core-pulse {
      0%, 100% { box-shadow: 0 0 30px 12px rgba(190,235,255,.95), 0 0 80px 30px rgba(110,190,255,.5), 0 0 160px 60px rgba(70,130,255,.28); }
      50% { box-shadow: 0 0 40px 18px rgba(210,245,255,1), 0 0 100px 40px rgba(130,210,255,.6), 0 0 200px 80px rgba(90,150,255,.35); }
    }
    @keyframes aura-breathe { 0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes spin-rev { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(-360deg); } }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="mid"></canvas>
  <canvas id="fx"></canvas>

  <div id="aura" class="abs-center"></div>
  <div id="beams" class="abs-center"></div>

  <div id="core-wrap" class="abs-center">
    <div class="orbit" id="o1"></div>
    <div class="orbit" id="o2"></div>
    <div class="orbit" id="o3"></div>
    <div class="orbit" id="o4"></div>
    <div class="orbit" id="o5"></div>
    <div id="core"></div>
  </div>

  <div id="cursor"></div>

  <script>
    const [bgCanvas, midCanvas, fxCanvas] = ['bg', 'mid', 'fx'].map(id => document.getElementById(id));
    const [bgCtx, midCtx, fxCtx] = [bgCanvas, midCanvas, fxCanvas].map(c => c.getContext('2d'));
    const cursor = document.getElementById('cursor');

    let W, H, cx, cy, stars = [], dust = [], meteors = [], particles = [], structures = [];
    let mouse = { x: 0, y: 0, tx: 0, ty: 0 }, time = 0, lastMeteor = 0, lastPulse = 0, hueShift = 0;

    // Generate beams dynamically
    const beamsWrap = document.getElementById('beams');
    for (let i = 0; i < 8; i++) {
      const b = document.createElement('div');
      b.className = 'beam';
      b.style.transform = `translate(-50%, -100%) rotate(${i * 45}deg)`;
      beamsWrap.appendChild(b);
    }

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      cx = W / 2; cy = H / 2;
      [bgCanvas, midCanvas, fxCanvas].forEach(c => { c.width = W; c.height = H; });

      stars = Array.from({ length: Math.floor((W * H) / 1400) }, () => ({
        x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1,
        size: Math.random() * 1.6 + 0.25, twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.025 + 0.004, hue: 200 + Math.random() * 40
      }));

      dust = Array.from({ length: Math.floor((W * H) / 9000) }, () => ({
        x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.4 + 0.6,
        size: Math.random() * 1.2 + 0.4, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, life: Math.random()
      }));

      structures = Array.from({ length: 4 }, () => ({
        x: Math.random() * W, y: Math.random() * H, z: 0.15 + Math.random() * 0.25,
        size: 40 + Math.random() * 70, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.003,
        type: Math.floor(Math.random() * 3), alpha: 0.04 + Math.random() * 0.06
      }));
    }

    function spawnMeteor() {
      const side = Math.floor(Math.random() * 4), speed = 4 + Math.random() * 7;
      let x = side === 1 ? W + 20 : side === 3 ? -20 : Math.random() * W;
      let y = side === 0 ? -20 : side === 2 ? H + 20 : Math.random() * H;
      let vx = side % 2 === 1 ? (side === 1 ? -speed : speed) : (Math.random() - 0.5) * 3;
      let vy = side % 2 === 0 ? (side === 0 ? speed : -speed) : (Math.random() - 0.5) * 3;
      meteors.push({ x, y, vx, vy, life: 1, len: 40 + Math.random() * 80, width: 1 + Math.random() * 1.5 });
    }

    function spawnBurst(x, y) {
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 1.5 + Math.random() * 5;
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1,
          decay: 0.012 + Math.random() * 0.02, size: 1 + Math.random() * 2.5, hue: 190 + Math.random() * 50
        });
      }
    }

    function drawBackground() {
      bgCtx.clearRect(0, 0, W, H);
      hueShift = (Math.sin(time * 0.00008) * 0.5 + 0.5) * 25;

      const g = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
      g.addColorStop(0, `hsla(${220 + hueShift}, 60%, 12%, 0.5)`);
      g.addColorStop(0.45, `hsla(${240 + hueShift * 0.6}, 50%, 7%, 0.35)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = g;
      bgCtx.fillRect(0, 0, W, H);

      [
        { x: 0.25 + Math.sin(time * 0.00005) * 0.03, y: 0.35, r: 0.38, h: 230 },
        { x: 0.72, y: 0.62 + Math.cos(time * 0.00004) * 0.025, r: 0.42, h: 270 },
        { x: 0.48, y: 0.28, r: 0.28, h: 210 },
        { x: 0.18, y: 0.72, r: 0.32, h: 250 },
        { x: 0.82, y: 0.25, r: 0.3, h: 200 }
      ].forEach(c => {
        const cg = bgCtx.createRadialGradient(W * c.x, H * c.y, 0, W * c.x, H * c.y, Math.max(W, H) * c.r);
        cg.addColorStop(0, `hsla(${c.h + hueShift}, 70%, 45%, ${0.07 + Math.sin(time * 0.0003 + c.h) * 0.02})`);
        cg.addColorStop(1, 'transparent');
        bgCtx.fillStyle = cg;
        bgCtx.fillRect(0, 0, W, H);
      });
    }

    function drawMid() {
      midCtx.clearRect(0, 0, W, H);
      const px = (mouse.x - cx) * 0.018, py = (mouse.y - cy) * 0.018;

      stars.forEach(s => {
        s.twinkle += s.speed;
        const alpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(s.twinkle));
        const dx = mouse.x - s.x, dy = mouse.y - s.y, dist = Math.hypot(dx, dy) || 1;
        const pull = Math.min(0.8 / dist, 0.015) * s.z;
        const sx = s.x + px * s.z * 28 + (dx / dist) * pull * 8;
        const sy = s.y + py * s.z * 28 + (dy / dist) * pull * 8;

        midCtx.beginPath();
        midCtx.arc(sx, sy, s.size * s.z, 0, Math.PI * 2);
        midCtx.fillStyle = `hsla(${s.hue}, 70%, 85%, ${alpha * s.z})`;
        midCtx.fill();

        if (s.size > 1.15) {
          midCtx.beginPath();
          midCtx.arc(sx, sy, s.size * s.z * 3.2, 0, Math.PI * 2);
          midCtx.fillStyle = `hsla(${s.hue}, 80%, 70%, ${alpha * 0.07 * s.z})`;
          midCtx.fill();
        }
      });

      structures.forEach(st => {
        st.rot += st.rotSpeed;
        const sx = st.x + px * st.z * 50, sy = st.y + py * st.z * 50, s = st.size * (0.6 + st.z);

        midCtx.save();
        midCtx.translate(sx, sy);
        midCtx.rotate(st.rot);
        midCtx.strokeStyle = `rgba(150, 210, 255, ${st.alpha})`;
        midCtx.lineWidth = 0.8;
        midCtx.beginPath();

        if (st.type === 0) {
          midCtx.moveTo(0, -s); midCtx.lineTo(s * 0.9, s * 0.5); midCtx.lineTo(-s * 0.9, s * 0.5); midCtx.closePath();
          midCtx.moveTo(0, -s); midCtx.lineTo(0, s * 0.2);
        } else if (st.type === 1) {
          const h = s * 0.45;
          midCtx.strokeRect(-h, -h, h * 2, h * 2); midCtx.strokeRect(-h * 0.6, -h * 0.6, h * 1.2, h * 1.2);
        } else {
          midCtx.moveTo(0, -s); midCtx.lineTo(s * 0.7, 0); midCtx.lineTo(0, s); midCtx.lineTo(-s * 0.7, 0); midCtx.closePath();
        }
        midCtx.stroke();
        midCtx.restore();
      });
    }

    function drawFx() {
      fxCtx.clearRect(0, 0, W, H);

      dust.forEach(d => {
        d.x = (d.x + d.vx + (mouse.x - cx) * 0.0003 * d.z + W) % W;
        d.y = (d.y + d.vy + (mouse.y - cy) * 0.0003 * d.z + H) % H;
        d.life += 0.008;

        fxCtx.beginPath();
        fxCtx.arc(d.x, d.y, d.size * d.z, 0, Math.PI * 2);
        fxCtx.fillStyle = `rgba(180, 220, 255, ${(0.15 + 0.25 * Math.sin(d.life)) * d.z})`;
        fxCtx.fill();
      });

      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx; m.y += m.vy; m.life -= 0.008;

        if (m.life <= 0 || m.x < -100 || m.x > W + 100 || m.y < -100 || m.y > H + 100) {
          meteors.splice(i, 1); continue;
        }

        const tailX = m.x - m.vx * (m.len / 6), tailY = m.y - m.vy * (m.len / 6);
        const grad = fxCtx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(220, 245, 255, ${m.life})`);
        grad.addColorStop(0.4, `rgba(140, 200, 255, ${m.life * 0.5})`);
        grad.addColorStop(1, 'transparent');

        fxCtx.beginPath();
        fxCtx.moveTo(m.x, m.y); fxCtx.lineTo(tailX, tailY);
        fxCtx.strokeStyle = grad; fxCtx.lineWidth = m.width * m.life; fxCtx.lineCap = 'round';
        fxCtx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.isRing) {
          p.radius += 3.5; p.life -= 0.006;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          fxCtx.beginPath();
          fxCtx.arc(cx, cy, p.radius, 0, Math.PI * 2);
          fxCtx.strokeStyle = `rgba(160, 220, 255, ${p.life * 0.25})`;
          fxCtx.lineWidth = 1.5 * p.life;
          fxCtx.stroke();
        } else {
          p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          fxCtx.fillStyle = `hsla(${p.hue}, 80%, 80%, ${p.life})`;
          fxCtx.fill();
        }
      }

      const nearby = stars
        .map(s => ({ x: s.x + (mouse.x - cx) * 0.02 * s.z * 30, y: s.y + (mouse.y - cy) * 0.02 * s.z * 30, d: Math.hypot(s.x - mouse.x, s.y - mouse.y), z: s.z }))
        .filter(s => s.d < 180 && s.z > 0.45);

      if (nearby.length > 1) {
        fxCtx.lineWidth = 0.55;
        for (let i = 0; i < nearby.length; i++) {
          for (let j = i + 1; j < nearby.length; j++) {
            const a = 1 - Math.max(nearby[i].d, nearby[j].d) / 180;
            if (a > 0.12) {
              fxCtx.beginPath();
              fxCtx.moveTo(nearby[i].x, nearby[i].y); fxCtx.lineTo(nearby[j].x, nearby[j].y);
              fxCtx.strokeStyle = `rgba(150, 210, 255, ${a * 0.22})`;
              fxCtx.stroke();
            }
          }
        }
      }

      if (time - lastPulse > 6000 + Math.random() * 4000) {
        lastPulse = time;
        particles.push({ isRing: true, radius: 0, life: 1 });
      }
    }

    function animate() {
      time = performance.now();
      mouse.x += (mouse.tx - mouse.x) * 0.09;
      mouse.y += (mouse.ty - mouse.y) * 0.09;

      if (time - lastMeteor > 1400 + Math.random() * 2200) {
        spawnMeteor(); lastMeteor = time;
      }

      drawBackground(); drawMid(); drawFx();
      requestAnimationFrame(animate);
    }

    const updatePointer = (x, y) => {
      mouse.tx = x; mouse.ty = y;
      cursor.style.left = x + 'px'; cursor.style.top = y + 'px';
    };

    const handleStart = (x, y) => {
      spawnBurst(x, y); cursor.classList.add('trail-active');
    };

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
    window.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => cursor.classList.remove('trail-active'));

    window.addEventListener('touchmove', e => e.touches[0] && updatePointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    window.addEventListener('touchstart', e => e.touches[0] && handleStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    window.addEventListener('touchend', () => cursor.classList.remove('trail-active'));

    resize();
    animate();
  </script>
</body>
</html>
